<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 200" width="580" height="200" role="img" aria-label="Reflective Code Generation Agent">
<style>
  @media (prefers-reduced-motion: reduce) { .rm { display: none; } }
  .r-mono { font-family: 'SF Mono', Consolas, Menlo, monospace; }
  .r-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', sans-serif; }
</style>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0" stop-color="#080C14"/>
  <stop offset="0.6" stop-color="#0D1524"/>
  <stop offset="1" stop-color="#121F36"/>
</linearGradient>
<linearGradient id="card-bg" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0" stop-color="#0B1220"/>
  <stop offset="1" stop-color="#0F1829"/>
</linearGradient>
<linearGradient id="border-glow" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0" stop-color="#38BDF8" stop-opacity="0.85"/>
  <stop offset="0.5" stop-color="#6366F1" stop-opacity="0.6"/>
  <stop offset="1" stop-color="#00D2FF" stop-opacity="0.35"/>
</linearGradient>
<linearGradient id="cyan-glow" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0" stop-color="#1E3A8A"/>
  <stop offset="0.5" stop-color="#38BDF8"/>
  <stop offset="1" stop-color="#1E3A8A" stop-opacity="0"/>
</linearGradient>
<linearGradient id="shimmer" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0" stop-color="#38BDF8" stop-opacity="0"/>
  <stop offset="0.5" stop-color="#38BDF8" stop-opacity="0.18"/>
  <stop offset="1" stop-color="#38BDF8" stop-opacity="0"/>
</linearGradient>
<linearGradient id="text-grad" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0" stop-color="#38BDF8"/>
  <stop offset="0.5" stop-color="#FFFFFF"/>
  <stop offset="1" stop-color="#818CF8"/>
</linearGradient>
<filter id="blur-glow" x="-100%" y="-100%" width="300%" height="300%">
  <feGaussianBlur stdDeviation="3"/>
</filter>
<filter id="big-glow" x="-50%" y="-300%" width="200%" height="700%">
  <feGaussianBlur stdDeviation="8"/>
</filter>
</defs>
<rect width="580" height="200" rx="14" fill="#0B1220"/>
<rect x="1" y="1" width="578" height="198" rx="13" fill="none" stroke="url(#border-glow)" stroke-width="1.2"/>

<!-- Left Edge Highlight -->
<rect x="0" y="20" width="4" height="160" rx="2" fill="#38BDF8"/>
<rect class="rm" x="0" y="20" width="4" height="160" rx="2" fill="#38BDF8" opacity="0">
  <animate attributeName="opacity" values="0;1;0" dur="4s" repeatCount="indefinite"/>
</rect>

<!-- Top Row: Category + ID + External Arrow -->
<text x="28" y="36" class="r-mono" font-size="10.5" font-weight="700" letter-spacing="1.5" fill="#38BDF8">AGENTIC AI · LLM REFLECTION</text>
<text x="510" y="36" class="r-mono" font-size="10.5" font-weight="700" fill="#64748B">PROJ_01</text>
<path d="M544 26L554 36M554 26L554 36L544 36" fill="none" stroke="#38BDF8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>

<!-- Title -->
<text x="28" y="68" class="r-sans" font-size="17" font-weight="700" fill="#F8FAFC">Reflective Code Generation Agent</text>

<!-- Description -->
<text x="28" y="96" class="r-sans" font-size="13" fill="#94A3B8">Intelligent AI agent implementing reflection loops to</text><text x="28" y="118" class="r-sans" font-size="13" fill="#94A3B8">autonomously generate, execute, test, and correct code.</text>

<!-- Bottom Row Tech Badges Aligned Horizontally -->

  <rect x="28" y="152" width="98" height="24" rx="12" fill="#0F172A" stroke="#1E293B" stroke-width="1"/>
  <text x="77.0" y="168" text-anchor="middle" font-family="'SF Mono', Consolas, Menlo, monospace" font-size="11" font-weight="600" fill="#38BDF8">Agentic AI</text>
  <rect x="134" y="152" width="138" height="24" rx="12" fill="#0F172A" stroke="#1E293B" stroke-width="1"/>
  <text x="203.0" y="168" text-anchor="middle" font-family="'SF Mono', Consolas, Menlo, monospace" font-size="11" font-weight="600" fill="#38BDF8">Reflection Loop</text>
  <rect x="280" y="152" width="66" height="24" rx="12" fill="#0F172A" stroke="#1E293B" stroke-width="1"/>
  <text x="313.0" y="168" text-anchor="middle" font-family="'SF Mono', Consolas, Menlo, monospace" font-size="11" font-weight="600" fill="#38BDF8">Python</text>
  <rect x="354" y="152" width="50" height="24" rx="12" fill="#0F172A" stroke="#1E293B" stroke-width="1"/>
  <text x="379.0" y="168" text-anchor="middle" font-family="'SF Mono', Consolas, Menlo, monospace" font-size="11" font-weight="600" fill="#38BDF8">LLMs</text>
</svg>