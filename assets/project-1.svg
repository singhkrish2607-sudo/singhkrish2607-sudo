<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 132" width="1200" height="132" role="img" aria-label="Reflective Self-Correcting Code Generation Agent">
<style>
  @media (prefers-reduced-motion: reduce) { .pm { display: none; } }
  .p-mono { font-family: 'SF Mono', Consolas, Menlo, monospace; }
  .p-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', sans-serif; }
</style>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0" stop-color="#080C14"/>
  <stop offset="0.6" stop-color="#0D1524"/>
  <stop offset="1" stop-color="#121F36"/>
</linearGradient>
<linearGradient id="card-bg" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0" stop-color="#0B1220"/>
  <stop offset="1" stop-color="#0F1829"/>
</linearGradient>
<linearGradient id="border-glow" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0" stop-color="#38BDF8" stop-opacity="0.75"/>
  <stop offset="0.5" stop-color="#6366F1" stop-opacity="0.5"/>
  <stop offset="1" stop-color="#00D2FF" stop-opacity="0.25"/>
</linearGradient>
<linearGradient id="cyan-glow" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0" stop-color="#1E3A8A"/>
  <stop offset="0.5" stop-color="#38BDF8"/>
  <stop offset="1" stop-color="#1E3A8A" stop-opacity="0"/>
</linearGradient>
<linearGradient id="shimmer" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0" stop-color="#38BDF8" stop-opacity="0"/>
  <stop offset="0.5" stop-color="#38BDF8" stop-opacity="0.14"/>
  <stop offset="1" stop-color="#38BDF8" stop-opacity="0"/>
</linearGradient>
<linearGradient id="text-grad" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0" stop-color="#38BDF8"/>
  <stop offset="0.5" stop-color="#FFFFFF"/>
  <stop offset="1" stop-color="#818CF8"/>
</linearGradient>
<filter id="blur-glow" x="-100%" y="-100%" width="300%" height="300%">
  <feGaussianBlur stdDeviation="3"/>
</filter>
<filter id="big-glow" x="-50%" y="-300%" width="200%" height="700%">
  <feGaussianBlur stdDeviation="6"/>
</filter>
</defs>
<rect width="1200" height="132" rx="14" fill="#0B1220"/>
<rect x="1" y="1" width="1198" height="130" rx="13" fill="none" stroke="url(#border-glow)" stroke-width="1.2"/>

<!-- Left Edge Highlight Pill -->
<rect x="0" y="24" width="4" height="84" rx="2" fill="#38BDF8"/>
<rect class="pm" x="0" y="24" width="4" height="84" rx="2" fill="#38BDF8" opacity="0">
  <animate attributeName="opacity" values="0;1;0" dur="4s" repeatCount="indefinite"/>
</rect>

<!-- Number Tag -->
<text x="32" y="38" class="p-mono" font-size="11" font-weight="700" letter-spacing="2" fill="#38BDF8">PROJ_01</text>
<circle cx="95" cy="34" r="2.5" fill="#64748B"/>
<text x="108" y="38" class="p-mono" font-size="11" font-weight="600" letter-spacing="1.5" fill="#64748B">AGENTIC AI · LLM REFLECTION</text>

<!-- Title -->
<text x="32" y="68" class="p-sans" font-size="20" font-weight="700" fill="#F8FAFC">Reflective Self-Correcting Code Generation Agent</text>

<!-- Description -->
<text x="32" y="93" class="p-sans" font-size="13.5" fill="#94A3B8">Intelligent AI agent implementing reflection loops to autonomously generate,</text>
<text x="32" y="113" class="p-sans" font-size="13.5" fill="#94A3B8">execute, test, and self-correct Python code against problem constraints.</text>

<!-- Right Tech Badges -->

<rect x="1112.0" y="26" width="58.0" height="26" rx="13" fill="#1E3A8A" stroke="#38BDF8" stroke-width="1"/>
<text x="1141.0" y="43" text-anchor="middle" font-family="'SF Mono', Consolas, Menlo, monospace" font-size="11" font-weight="600" fill="#38BDF8">LLMs</text>
<rect x="1037.0" y="58" width="75.0" height="26" rx="13" fill="#0F172A" stroke="#1E293B" stroke-width="1"/>
<text x="1074.5" y="75" text-anchor="middle" font-family="'SF Mono', Consolas, Menlo, monospace" font-size="11" font-weight="600" fill="#94A3B8">Python</text>
<rect x="860.0" y="90" width="177.0" height="26" rx="13" fill="#0F172A" stroke="#1E293B" stroke-width="1"/>
<text x="948.5" y="107" text-anchor="middle" font-family="'SF Mono', Consolas, Menlo, monospace" font-size="11" font-weight="600" fill="#94A3B8">Reflection Pattern</text>
<rect x="751.0" y="26" width="109.0" height="26" rx="13" fill="#0F172A" stroke="#1E293B" stroke-width="1"/>
<text x="805.5" y="43" text-anchor="middle" font-family="'SF Mono', Consolas, Menlo, monospace" font-size="11" font-weight="600" fill="#94A3B8">Agentic AI</text>
</svg>