<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 284" width="1200" height="284" role="img" aria-label="Career Timeline">
<style>
  @media (prefers-reduced-motion: reduce) { .tm { display: none; } }
  .t-mono { font-family: 'SF Mono', Consolas, Menlo, monospace; }
  .t-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', sans-serif; }
</style>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0" stop-color="#080C14"/>
  <stop offset="0.6" stop-color="#0D1524"/>
  <stop offset="1" stop-color="#121F36"/>
</linearGradient>
<linearGradient id="card-bg" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0" stop-color="#0B1220"/>
  <stop offset="1" stop-color="#0F1829"/>
</linearGradient>
<linearGradient id="border-glow" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0" stop-color="#38BDF8" stop-opacity="0.75"/>
  <stop offset="0.5" stop-color="#6366F1" stop-opacity="0.5"/>
  <stop offset="1" stop-color="#00D2FF" stop-opacity="0.25"/>
</linearGradient>
<linearGradient id="cyan-glow" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0" stop-color="#1E3A8A"/>
  <stop offset="0.5" stop-color="#38BDF8"/>
  <stop offset="1" stop-color="#1E3A8A" stop-opacity="0"/>
</linearGradient>
<linearGradient id="shimmer" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0" stop-color="#38BDF8" stop-opacity="0"/>
  <stop offset="0.5" stop-color="#38BDF8" stop-opacity="0.14"/>
  <stop offset="1" stop-color="#38BDF8" stop-opacity="0"/>
</linearGradient>
<linearGradient id="text-grad" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0" stop-color="#38BDF8"/>
  <stop offset="0.5" stop-color="#FFFFFF"/>
  <stop offset="1" stop-color="#818CF8"/>
</linearGradient>
<filter id="blur-glow" x="-100%" y="-100%" width="300%" height="300%">
  <feGaussianBlur stdDeviation="3"/>
</filter>
<filter id="big-glow" x="-50%" y="-300%" width="200%" height="700%">
  <feGaussianBlur stdDeviation="6"/>
</filter>
</defs>

<!-- Background -->
<rect width="1200" height="284" rx="16" fill="#080C14" stroke="url(#border-glow)" stroke-width="1.2"/>

<!-- Timeline Connecting Rail -->
<rect x="80" y="52" width="1040" height="2" fill="url(#cyan-glow)"/>
<rect class="tm" x="80" y="51" width="140" height="4" rx="2" fill="#38BDF8" filter="url(#blur-glow)" opacity="0.8">
  <animate attributeName="x" values="80;980;80" dur="11s" repeatCount="indefinite"/>
</rect>

<!-- Node 1: Present (SQL Developer and Trainer) -->
<g transform="translate(140, 0)">
  <text x="0" y="32" text-anchor="middle" class="t-mono" font-size="12" font-weight="700" letter-spacing="2" fill="#38BDF8">SEP 2024 — PRESENT</text>
  <circle cx="0" cy="53" r="16" fill="#38BDF8" opacity="0.15"/>
  <circle cx="0" cy="53" r="8" fill="#0D1524" stroke="#38BDF8" stroke-width="2.5"/>
  <circle cx="0" cy="53" r="3.5" fill="#38BDF8"/>
  
  <rect x="-140" y="85" width="280" height="175" rx="12" fill="#0B1220" stroke="#1E293B" stroke-width="1"/>
  <rect x="-140" y="85" width="280" height="3" fill="#38BDF8" rx="1.5"/>
  <text x="-122" y="112" class="t-sans" font-size="14.5" font-weight="700" fill="#F8FAFC">SQL Developer &amp; Trainer</text>
  <text x="-122" y="132" class="t-mono" font-size="11.5" font-weight="600" fill="#38BDF8">Cupule Technologies Pvt. Ltd.</text>
  <text x="-122" y="156" class="t-sans" font-size="11.5" fill="#94A3B8">• Advanced SQL: multi-table joins, CTEs</text>
  <text x="-122" y="174" class="t-sans" font-size="11.5" fill="#94A3B8">  window functions &amp; schema audits (SRS)</text>
  <text x="-122" y="196" class="t-sans" font-size="11.5" fill="#94A3B8">• Trained &amp; mentored 60-70 students</text>
  <text x="-122" y="218" class="t-sans" font-size="11.5" fill="#94A3B8">• AI-agent &amp; RAG customer systems</text>
  <text x="-122" y="240" class="t-mono" font-size="10.5" fill="#22C55E">● Current Role</text>
</g>

<!-- Node 2: Data Analyst Intern -->
<g transform="translate(600, 0)">
  <text x="0" y="32" text-anchor="middle" class="t-mono" font-size="12" font-weight="700" letter-spacing="2" fill="#818CF8">MAR 2024 — SEP 2024</text>
  <circle cx="0" cy="53" r="16" fill="#6366F1" opacity="0.15"/>
  <circle cx="0" cy="53" r="8" fill="#0D1524" stroke="#818CF8" stroke-width="2.5"/>
  <circle cx="0" cy="53" r="3.5" fill="#818CF8"/>
  
  <rect x="-140" y="85" width="280" height="175" rx="12" fill="#0B1220" stroke="#1E293B" stroke-width="1"/>
  <rect x="-140" y="85" width="280" height="3" fill="#6366F1" rx="1.5"/>
  <text x="-122" y="112" class="t-sans" font-size="14.5" font-weight="700" fill="#F8FAFC">Data Analyst Intern</text>
  <text x="-122" y="132" class="t-mono" font-size="11.5" font-weight="600" fill="#818CF8">Cupule Technologies Pvt. Ltd.</text>
  <text x="-122" y="156" class="t-sans" font-size="11.5" fill="#94A3B8">• Analyzed enterprise transaction data</text>
  <text x="-122" y="174" class="t-sans" font-size="11.5" fill="#94A3B8">  with Python, MySQL &amp; PostgreSQL</text>
  <text x="-122" y="196" class="t-sans" font-size="11.5" fill="#94A3B8">• Created automated business reports</text>
  <text x="-122" y="218" class="t-sans" font-size="11.5" fill="#94A3B8">• Streamlined data cleaning workflows</text>
  <text x="-122" y="240" class="t-mono" font-size="10.5" fill="#64748B">✓ 6 Months Completed</text>
</g>

<!-- Node 3: B.Sc. Mathematics -->
<g transform="translate(1060, 0)">
  <text x="0" y="32" text-anchor="middle" class="t-mono" font-size="12" font-weight="700" letter-spacing="2" fill="#38BDF8">2021 — 2024</text>
  <circle cx="0" cy="53" r="16" fill="#38BDF8" opacity="0.15"/>
  <circle cx="0" cy="53" r="8" fill="#0D1524" stroke="#38BDF8" stroke-width="2.5"/>
  <circle cx="0" cy="53" r="3.5" fill="#38BDF8"/>
  
  <rect x="-140" y="85" width="260" height="175" rx="12" fill="#0B1220" stroke="#1E293B" stroke-width="1"/>
  <rect x="-140" y="85" width="260" height="3" fill="#38BDF8" rx="1.5"/>
  <text x="-122" y="112" class="t-sans" font-size="14.5" font-weight="700" fill="#F8FAFC">B.Sc. in Mathematics</text>
  <text x="-122" y="132" class="t-mono" font-size="11.5" font-weight="600" fill="#38BDF8">Bundelkhand University</text>
  <text x="-122" y="156" class="t-sans" font-size="11.5" fill="#94A3B8">• Discrete Math &amp; Linear Algebra</text>
  <text x="-122" y="178" class="t-sans" font-size="11.5" fill="#94A3B8">• Probability, Statistics &amp; Modeling</text>
  <text x="-122" y="200" class="t-sans" font-size="11.5" fill="#94A3B8">• Rigorous quantitative problem-solving</text>
  <text x="-122" y="240" class="t-mono" font-size="10.5" fill="#64748B">✓ Degree Conferred (2024)</text>
</g>
</svg>