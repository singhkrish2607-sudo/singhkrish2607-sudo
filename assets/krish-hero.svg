<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="1200" height="440" role="img" aria-label="Krish Singh - SQL Developer and Data Analyst | Agentic AI Developer">
<style>
  @media (prefers-reduced-motion: reduce) { .motion { display: none; } }
  .font-mono { font-family: 'SF Mono', Consolas, 'Liberation Mono', Menlo, monospace; }
  .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif; }
</style>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0" stop-color="#080C14"/>
  <stop offset="0.6" stop-color="#0D1524"/>
  <stop offset="1" stop-color="#121F36"/>
</linearGradient>
<linearGradient id="card-bg" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0" stop-color="#0B1220"/>
  <stop offset="1" stop-color="#0F1829"/>
</linearGradient>
<linearGradient id="border-glow" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0" stop-color="#38BDF8" stop-opacity="0.75"/>
  <stop offset="0.5" stop-color="#6366F1" stop-opacity="0.5"/>
  <stop offset="1" stop-color="#00D2FF" stop-opacity="0.25"/>
</linearGradient>
<linearGradient id="cyan-glow" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0" stop-color="#1E3A8A"/>
  <stop offset="0.5" stop-color="#38BDF8"/>
  <stop offset="1" stop-color="#1E3A8A" stop-opacity="0"/>
</linearGradient>
<linearGradient id="shimmer" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0" stop-color="#38BDF8" stop-opacity="0"/>
  <stop offset="0.5" stop-color="#38BDF8" stop-opacity="0.14"/>
  <stop offset="1" stop-color="#38BDF8" stop-opacity="0"/>
</linearGradient>
<linearGradient id="text-grad" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0" stop-color="#38BDF8"/>
  <stop offset="0.5" stop-color="#FFFFFF"/>
  <stop offset="1" stop-color="#818CF8"/>
</linearGradient>
<filter id="blur-glow" x="-100%" y="-100%" width="300%" height="300%">
  <feGaussianBlur stdDeviation="3"/>
</filter>
<filter id="big-glow" x="-50%" y="-300%" width="200%" height="700%">
  <feGaussianBlur stdDeviation="6"/>
</filter>
</defs>
<rect width="1200" height="440" rx="16" fill="url(#bg)"/>
<rect x="1" y="1" width="1198" height="438" rx="15" fill="none" stroke="url(#border-glow)" stroke-width="1.2"/>

<!-- Decorative Tech Grid Pattern -->
<g opacity="0.06">
  <path d="M0 60 H1200 M0 120 H1200 M0 180 H1200 M0 240 H1200 M0 300 H1200 M0 360 H1200" stroke="#38BDF8" stroke-width="1"/>
  <path d="M120 0 V440 M240 0 V440 M360 0 V440 M480 0 V440 M600 0 V440 M720 0 V440 M840 0 V440 M960 0 V440 M1080 0 V440" stroke="#38BDF8" stroke-width="1"/>
</g>

<!-- Ambient Glowing Orbs -->
<circle cx="150" cy="80" r="120" fill="#00D2FF" opacity="0.08" filter="url(#big-glow)"/>
<circle cx="1050" cy="360" r="140" fill="#6366F1" opacity="0.09" filter="url(#big-glow)"/>

<!-- Floating Particles -->
<g class="motion">
  <circle cx="340" cy="90" r="2" fill="#38BDF8" opacity="0.4"><animate attributeName="cy" values="90;70;90" dur="8s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.2;0.8;0.2" dur="8s" repeatCount="indefinite"/></circle>
  <circle cx="880" cy="140" r="2.5" fill="#818CF8" opacity="0.5"><animate attributeName="cy" values="140;115;140" dur="7s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.3;0.9;0.3" dur="7s" repeatCount="indefinite"/></circle>
  <circle cx="210" cy="330" r="1.8" fill="#38BDF8" opacity="0.3"><animate attributeName="cy" values="330;350;330" dur="9s" repeatCount="indefinite"/></circle>
  <circle cx="980" cy="270" r="2.2" fill="#60A5FA" opacity="0.4"><animate attributeName="cy" values="270;250;270" dur="6s" repeatCount="indefinite"/></circle>
</g>

<!-- Status Pill -->
<g transform="translate(60, 52)">
  <rect width="320" height="30" rx="15" fill="#0F172A" stroke="#38BDF8" stroke-opacity="0.4" stroke-width="1"/>
  <circle cx="18" cy="15" r="4.5" fill="#22C55E"/>
  <circle class="motion" cx="18" cy="15" r="4.5" fill="#22C55E" opacity="0.6">
    <animate attributeName="r" values="4.5;9;4.5" dur="2.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;0;0.6" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <text x="32" y="20" class="font-mono" font-size="11" font-weight="600" letter-spacing="1.5" fill="#38BDF8">OPEN FOR COLLABORATION</text>
</g>

<!-- Terminal Prompt Accent -->
<text x="60" y="125" class="font-mono" font-size="13" letter-spacing="2" fill="#64748B">// GITHUB.DEVELOPER.PROFILE</text>

<!-- Main Name -->
<text x="60" y="205" class="font-sans" font-size="74" font-weight="800" letter-spacing="-1.5" fill="url(#text-grad)">KRISH SINGH</text>

<!-- Primary Roles Subtitle -->
<g transform="translate(60, 245)">
  <text x="0" y="0" class="font-mono" font-size="18" font-weight="700" letter-spacing="3" fill="#38BDF8">SQL DEVELOPER &amp; DATA ANALYST</text>
  <circle cx="430" cy="-6" r="3" fill="#6366F1"/>
  <text x="445" y="0" class="font-mono" font-size="18" font-weight="700" letter-spacing="3" fill="#818CF8">AGENTIC AI DEVELOPER</text>
</g>

<!-- Bio / Tagline (Dev-focused, no corporate history/degrees) -->
<text x="60" y="295" class="font-sans" font-size="16.5" fill="#94A3B8" font-weight="400">
  Building self-correcting AI code generation agents, RAG knowledge systems &amp; vector search engines.
</text>
<text x="60" y="322" class="font-sans" font-size="16.5" fill="#94A3B8" font-weight="400">
  Engineering high-performance relational architectures, dimensional schemas &amp; automated ETL pipelines.
</text>

<!-- Highlight Badges Bar (Dev & Code focused) -->
<g transform="translate(60, 362)">
  <!-- Badge 1: Location -->
  <rect x="0" y="0" width="130" height="34" rx="17" fill="#0F172A" stroke="#1E293B" stroke-width="1"/>
  <text x="65" y="22" text-anchor="middle" class="font-mono" font-size="11.5" font-weight="600" fill="#E2E8F0">📍 INDIA</text>

  <!-- Badge 2: Tech Core -->
  <rect x="142" y="0" width="200" height="34" rx="17" fill="#0F172A" stroke="#1E293B" stroke-width="1"/>
  <text x="242" y="22" text-anchor="middle" class="font-mono" font-size="11.5" font-weight="600" fill="#38BDF8">🐍 PYTHON &amp; SQL</text>

  <!-- Badge 3: Specialization -->
  <rect x="354" y="0" width="180" height="34" rx="17" fill="#0F172A" stroke="#1E293B" stroke-width="1"/>
  <text x="444" y="22" text-anchor="middle" class="font-mono" font-size="11.5" font-weight="600" fill="#818CF8">🤖 AGENTIC AI</text>

  <!-- Badge 4: Open Source -->
  <rect x="546" y="0" width="190" height="34" rx="17" fill="#0F172A" stroke="#1E293B" stroke-width="1"/>
  <text x="641" y="22" text-anchor="middle" class="font-mono" font-size="11.5" font-weight="600" fill="#E2E8F0">⚡ OPEN SOURCE</text>
</g>

<!-- Right Side Tech Decorative Glyph -->
<g transform="translate(980, 80)" opacity="0.6">
  <rect x="0" y="0" width="160" height="160" rx="20" fill="none" stroke="#1E3A8A" stroke-width="1.5" stroke-dasharray="6 6"/>
  <rect x="20" y="20" width="120" height="120" rx="14" fill="#0D1524" stroke="#38BDF8" stroke-width="1" stroke-opacity="0.4"/>
  <path d="M40 80 H120 M80 40 V120" stroke="#6366F1" stroke-width="1.5" stroke-dasharray="4 4"/>
  <circle cx="80" cy="80" r="16" fill="#0B1220" stroke="#38BDF8" stroke-width="2"/>
  <circle cx="80" cy="80" r="5" fill="#00D2FF"/>
  <text x="80" y="165" text-anchor="middle" class="font-mono" font-size="10" letter-spacing="2" fill="#38BDF8">SQL // AGENT</text>
</g>
</svg>