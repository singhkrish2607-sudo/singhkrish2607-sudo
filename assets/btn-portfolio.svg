<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 62" width="280" height="62" role="img" aria-label="PORTFOLIO">
<style>
  @media (prefers-reduced-motion: reduce) { .bm { display: none; } }
  .btn-text { font-family: 'SF Mono', Consolas, Menlo, monospace; font-size: 15px; font-weight: 700; letter-spacing: 2.5px; fill: #F8FAFC; }
</style>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0" stop-color="#080C14"/>
  <stop offset="0.6" stop-color="#0D1524"/>
  <stop offset="1" stop-color="#121F36"/>
</linearGradient>
<linearGradient id="card-bg" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0" stop-color="#0B1220"/>
  <stop offset="1" stop-color="#0F1829"/>
</linearGradient>
<linearGradient id="border-glow" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0" stop-color="#38BDF8" stop-opacity="0.85"/>
  <stop offset="0.5" stop-color="#6366F1" stop-opacity="0.6"/>
  <stop offset="1" stop-color="#00D2FF" stop-opacity="0.35"/>
</linearGradient>
<linearGradient id="cyan-glow" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0" stop-color="#1E3A8A"/>
  <stop offset="0.5" stop-color="#38BDF8"/>
  <stop offset="1" stop-color="#1E3A8A" stop-opacity="0"/>
</linearGradient>
<linearGradient id="shimmer" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0" stop-color="#38BDF8" stop-opacity="0"/>
  <stop offset="0.5" stop-color="#38BDF8" stop-opacity="0.18"/>
  <stop offset="1" stop-color="#38BDF8" stop-opacity="0"/>
</linearGradient>
<linearGradient id="text-grad" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0" stop-color="#38BDF8"/>
  <stop offset="0.5" stop-color="#FFFFFF"/>
  <stop offset="1" stop-color="#818CF8"/>
</linearGradient>
<filter id="blur-glow" x="-100%" y="-100%" width="300%" height="300%">
  <feGaussianBlur stdDeviation="3"/>
</filter>
<filter id="big-glow" x="-50%" y="-300%" width="200%" height="700%">
  <feGaussianBlur stdDeviation="8"/>
</filter>
</defs>
<rect x="2" y="2" width="276" height="58" rx="29" fill="#0D1524" stroke="url(#border-glow)" stroke-width="1.5"/>

<!-- Shimmer animation sweep -->
<rect class="bm" x="-120" y="2" width="120" height="58" fill="url(#shimmer)">
  <animate attributeName="x" values="-120;280" dur="4.5s" repeatCount="indefinite"/>
</rect>

<!-- Glowing indicator -->
<circle cx="34" cy="31" r="5" fill="#1E3A8A"/>
<circle cx="34" cy="31" r="2.5" fill="#38BDF8"/>

<text x="135" y="37" text-anchor="middle" class="btn-text">PORTFOLIO</text>

<!-- Arrow Icon -->
<path d="M236 31H248M243 26L248 31L243 36" fill="none" stroke="#38BDF8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>